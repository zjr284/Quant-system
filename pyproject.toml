[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-spot-agent"
version = "0.1.0"
description = "Auditable Binance Spot research, monitoring, and Testnet execution"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
crypto = ["websockets>=12,<16", "binance-sdk-spot>=13.3,<14"]
dev = ["pytest>=8,<10"]

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
